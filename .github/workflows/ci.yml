name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=@vuqs/core

      - name: Test & Coverage
        run: pnpm exec turbo run test:coverage --filter=@vuqs/core

      - name: Upload coverage to Codecov
        if: matrix.node == 24
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: packages/core/coverage/lcov.info
          disable_search: true
          flags: core

      - name: Test built package and types
        run: pnpm test:package

  nuxt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dev prepare
        run: pnpm dev:prepare

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=@vuqs/nuxt

      - name: Run unit tests
        run: pnpm exec turbo run test:unit --filter=@vuqs/nuxt

      - name: Install Playwright browsers
        run: pnpm --filter @vuqs/nuxt exec playwright-core install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm exec turbo run test:e2e --filter=@vuqs/nuxt

      - name: Build
        run: pnpm exec turbo run build --filter=@vuqs/nuxt
