name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - run: pnpm --filter @vuqs/nuxt exec playwright-core install --with-deps chromium

      - run: pnpm --filter @vuqs/nuxt test:run

      - run: pnpm build

      - run: pnpm --filter @vuqs/core test:types:dist

      - run: pnpm --filter @vuqs/core test:dist

      - run: pnpm playground:build

      - run: pnpm docs:build
