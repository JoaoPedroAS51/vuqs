minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - chokidar@4.0.3
  - undici-types@6.21.0

shellEmulator: true

packages:
  - packages/*
  - docs
  - playground

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: true

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@changesets/cli': ^3.0.3
  '@nuxt/kit': ^4.5.2
  '@nuxt/module-builder': ^1.0.4
  '@nuxt/schema': ^4.5.2
  '@nuxt/test-utils': ^4.4.0
  '@playwright/test': ^1.65.1
  '@standard-schema/spec': ^1.1.0
  '@types/node': ^22.20.5
  '@vitejs/plugin-vue': ^6.0.11
  '@vitest/coverage-v8': ^5.1.1
  defu: ^6.1.7
  eslint: ^10.15.0
  eslint-plugin-import-x: ^4.18.1
  nuxt: ^4.5.2
  playwright-core: ^1.65.1
  tsdown: ^0.23.7
  turbo: ^2.11.13
  typescript: npm:@typescript/typescript6@6.0.2
  typescript-next: npm:typescript@7.1.0-dev.20261120.1
  vite: ^8.3.8
  vitepress: 2.0.0-alpha.20
  vitest: ^5.1.1
  vue: ^3.5.46
  vue-router: ^5.5.1
  vue-tsc: ^3.3.14
