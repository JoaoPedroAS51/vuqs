minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - chokidar@4.0.3
  - undici-types@6.21.0

shellEmulator: true

packages:
  - packages/*
  - docs
  - playground

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: true

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@changesets/cli': ^3.0.3
  '@nuxt/kit': ^4.5.2
  '@nuxt/module-builder': ^1.0.3
  '@nuxt/schema': ^4.5.2
  '@nuxt/test-utils': ^4.3.4
  '@playwright/test': ^1.65.0
  '@standard-schema/spec': ^1.1.0
  '@types/node': ^22.20.5
  '@typescript/native-preview': npm:typescript@7.0.2
  '@vitejs/plugin-vue': ^6.0.10
  '@vitest/coverage-v8': ^5.1.0
  defu: ^6.1.7
  eslint: ^10.14.0
  eslint-plugin-import-x: ^4.17.1
  nuxt: ^4.5.2
  playwright-core: ^1.65.0
  tsdown: ^0.23.5
  turbo: ^2.11.10
  typescript: npm:@typescript/typescript6@6.0.2
  vite: ^8.3.6
  vitepress: 2.0.0-alpha.20
  vitest: ^5.1.0
  vue: ^3.5.45
  vue-router: ^5.4.0
  vue-tsc: ^3.3.14
